# journald limits for the kiosk (copy to /etc/systemd/journald.conf.d/).
# Agent logs never contain transcripts, typed text or audio; capping size
# and age still bounds the SD card wear and any operational metadata.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=50M
SystemKeepFree=500M
SystemMaxFileSize=10M
MaxRetentionSec=14day
RateLimitIntervalSec=30s
RateLimitBurst=2000
ForwardToSyslog=no
